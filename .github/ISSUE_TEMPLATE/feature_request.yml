name: 功能建議
description: 提出新功能或改進想法
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 目前遇到什麼不方便的地方
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議的做法
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的其他做法
