name: Release

# 推送 v* 標籤時建置 dmg 並附到 GitHub Release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
        env:
          # 沒有 Apple 開發者憑證,不簽章也不嘗試尋找憑證
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "AI Roundtable $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
