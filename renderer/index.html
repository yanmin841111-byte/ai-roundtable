<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>AI Roundtable</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="drag-region"></div>
      <div class="side-title">
        <span class="logo">◎</span>
        <div><div class="app-name">AI Roundtable</div><div class="app-sub">多 AI CLI 圓桌會議</div></div>
      </div>

      <div class="side-section">
        <div class="side-head"><span>成員</span><button id="add-agent" class="ghost small">+ 新增</button></div>
        <div id="agent-list"></div>
      </div>

      <div class="side-section">
        <div class="side-head"><span>設定</span></div>
        <label class="field">
          <span>工作目錄</span>
          <div class="row">
            <input id="work-dir" type="text" spellcheck="false" />
            <button id="pick-dir" class="ghost small" title="選擇資料夾">📁</button>
            <button id="open-dir" class="ghost small" title="在 Finder 開啟">↗</button>
          </div>
        </label>
        <div class="row gap">
          <label class="field half"><span>最大討論回合</span><input id="max-rounds" type="number" min="1" max="10" /></label>
          <label class="field half"><span>回覆語言</span><input id="language" type="text" /></label>
        </div>
        <label class="field"><span>主持人(負責分工與總結)</span><select id="lead-agent"></select></label>
      </div>

      <div class="side-section">
        <div class="side-head">
          <span>CLI 與擴充</span>
          <span class="row">
            <button id="ext-add" class="ghost small" title="從範本新增 CLI 或 API">+ 新增</button>
            <button id="ext-open-dir" class="ghost small" title="開啟擴充資料夾">📁</button>
            <button id="ext-reload" class="ghost small" title="重新載入擴充">↻</button>
          </span>
        </div>
        <div id="ext-list" class="ext-list"></div>
        <button id="ext-docs" class="link small">擴充撰寫說明 ↗</button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div class="drag-region"></div>
        <div id="phase-pill" class="phase idle">閒置</div>
        <div class="spacer"></div>
        <button id="stop-btn" class="danger small" disabled>■ 停止</button>
        <button id="reset-btn" class="ghost small">🗑 新對話</button>
      </header>

      <section id="timeline">
        <div id="empty" class="empty">
          <div class="empty-icon">◎</div>
          <div class="empty-title">把任務丟給圓桌</div>
          <div class="empty-sub">成員會輪流討論、達成共識後由主持人分工,各自在工作目錄執行,最後互相審查。</div>
        </div>
      </section>

      <footer id="composer">
        <div class="composer-box">
          <textarea id="input" rows="3" placeholder="描述任務,例如:用 Node.js 寫一個 CLI 待辦事項工具,支援新增、列出、完成、刪除…(Enter 送出,Shift+Enter 換行)"></textarea>
          <div class="composer-bar">
            <select id="mode">
              <option value="divide">討論 → 分工執行 → 交叉審查</option>
              <option value="discuss">只討論,不執行</option>
            </select>
            <div class="spacer"></div>
            <span id="hint" class="hint"></span>
            <button id="send-btn" class="primary">送出</button>
          </div>
        </div>
      </footer>
    </main>
  </div>

  <!-- 成員編輯視窗 -->
  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span id="modal-title">編輯成員</span><button id="modal-close" class="ghost small">✕</button></div>
      <div class="modal-body">
        <div class="row gap">
          <label class="field grow"><span>名稱</span><input id="f-name" type="text" /></label>
          <label class="field"><span>顏色</span><input id="f-color" type="color" /></label>
        </div>
        <div class="row gap">
          <label class="field half"><span>AI CLI</span><select id="f-cli"></select></label>
          <label class="field half"><span>模型 / 版本</span><select id="f-model-select"></select><input id="f-model" type="text" placeholder="輸入模型名稱" spellcheck="false" style="margin-top:6px" /></label>
        </div>
        <div class="row gap">
          <label class="field half"><span>強度(推理力度)</span><select id="f-effort"></select></label>
          <label class="field half checks">
            <span>&nbsp;</span>
            <label class="check" id="f-canEdit-wrap"><input id="f-canEdit" type="checkbox" /> 允許修改檔案與執行指令</label>
            <label class="check"><input id="f-enabled" type="checkbox" /> 啟用</label>
          </label>
        </div>
        <div id="f-model-desc" class="model-desc"></div>
        <label class="field" id="f-custom-wrap">
          <span>自訂指令(提示詞會從 stdin 送入,stdout 當作回覆;可用 {model}、{effort})</span>
          <input id="f-custom" type="text" placeholder="例如:gemini -m {model} -p -" spellcheck="false" />
        </label>
        <label class="field">
          <span>角色與個性</span>
          <textarea id="f-persona" rows="4" placeholder="例如:嚴謹的資深架構師,重視正確性與可維護性…"></textarea>
        </label>
      </div>
      <div class="modal-foot">
        <button id="modal-delete" class="danger small">刪除成員</button>
        <div class="spacer"></div>
        <button id="modal-save" class="primary">儲存</button>
      </div>
    </div>
  </div>

  <!-- 擴充範本選擇 -->
  <div id="ext-picker" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head"><span>新增 CLI / API</span><button id="ext-picker-close" class="ghost small">✕</button></div>
      <div class="modal-body">
        <div class="hint" style="margin-bottom:10px">選一個範本複製到你的擴充資料夾,之後可以直接編輯。沒有你要的 CLI 或 API 時,選空白範本自己填。</div>
        <div id="ext-templates" class="template-list"></div>
      </div>
    </div>
  </div>

  <!-- 擴充編輯器 -->
  <div id="ext-editor" class="modal hidden">
    <div class="modal-card wide">
      <div class="modal-head"><span id="ext-editor-title">編輯擴充</span><button id="ext-editor-close" class="ghost small">✕</button></div>
      <div class="modal-body">
        <label class="field"><span>檔名(.json 或 .js)</span><input id="ext-file" type="text" spellcheck="false" /></label>
        <textarea id="ext-content" class="code-editor" rows="22" spellcheck="false"></textarea>
        <div id="ext-error" class="error-text" hidden></div>
        <div id="ext-ok" class="ok-text" hidden></div>
      </div>
      <div class="modal-foot">
        <button id="ext-delete" class="danger small">刪除擴充</button>
        <div class="spacer"></div>
        <button id="ext-editor-docs" class="ghost small">欄位說明 ↗</button>
        <button id="ext-save" class="primary">儲存並載入</button>
      </div>
    </div>
  </div>

  <script src="../src/shared.js"></script>
  <script src="../src/model-rules.js"></script>
  <script src="../node_modules/marked/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
